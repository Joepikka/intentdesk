[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intentdesk"
version = "0.1.0"
description = "A reproducible intent-classification learning project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
neural = ["torch>=2.6,<3", "transformers>=4.48,<5", "safetensors>=0.5,<1", "psutil>=6,<8"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
intentdesk = "intentdesk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentdesk = ["web/*.html", "web/*.css", "web/*.js", "web/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

