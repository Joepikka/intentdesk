name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv and locked CPU dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --locked --extra dev --extra neural --extra web
      - name: Python tests (no model downloads)
        run: uv run --locked --extra dev --extra neural --extra web pytest -q
      - name: JavaScript queue regressions
        run: node --test tests/queue_page.test.mjs
      - name: Toy analytic gradient check
        run: uv run --locked python learning/math_exercise.py
